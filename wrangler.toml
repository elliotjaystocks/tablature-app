name = "tablature"
pages_build_output_dir = "public"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# Songs live in a D1 (SQLite) database.
# Create it with `npx wrangler d1 create tablature` and paste the id below.
[[d1_databases]]
binding = "DB"
database_name = "tablature"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"

# Uploaded tab photos are kept in R2 so you can refer back to them while editing.
# Create the bucket with `npx wrangler r2 bucket create tablature-images`.
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "tablature-images"

# Non-secret settings for Cloudflare Access (see README).
# ANTHROPIC_API_KEY is a secret: set it with `npx wrangler pages secret put ANTHROPIC_API_KEY`.
[vars]
ACCESS_TEAM_DOMAIN = "REPLACE_WITH_YOUR_TEAM.cloudflareaccess.com"
ACCESS_AUD = "REPLACE_WITH_YOUR_ACCESS_APPLICATION_AUD_TAG"
